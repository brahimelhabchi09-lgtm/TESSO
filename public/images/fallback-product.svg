<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="50%" stop-color="#EFECE6" />
      <stop offset="100%" stop-color="#E5E1D8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C2A0" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E8058" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="400" cy="270" r="240" fill="url(#glow)" />

  <!-- Subtle grid lines resembling luxury tile / showroom architecture -->
  <g opacity="0.08" stroke="#1C1D21" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600" />
    <line x1="720" y1="0" x2="720" y2="600" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="480" x2="800" y2="480" />
  </g>

  <!-- Center Luxury Icon & Framing -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <!-- Outer Elegant Frame -->
    <rect x="-90" y="-90" width="180" height="180" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <rect x="-80" y="-80" width="160" height="160" rx="2" fill="#FFFFFF" fill-opacity="0.5" stroke="#D5C7B0" stroke-width="1"/>
    
    <!-- Architectural Silhouette (Bath / Vanity / Sanitary icon) -->
    <path d="M-40 10 C -40 35, 40 35, 40 10 L 40 -15 L -40 -15 Z" fill="none" stroke="#2B2D33" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Faucet stream / mirror arch -->
    <path d="M-5 -15 L -5 -35 C -5 -45, 10 -45, 10 -35" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="-28" r="2" fill="#AD926B"/>
    <!-- Feet -->
    <line x1="-30" y1="28" x2="-35" y2="40" stroke="#2B2D33" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="28" x2="35" y2="40" stroke="#2B2D33" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Brand badge -->
    <text y="130" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" letter-spacing="4" fill="#1C1D21">TESSO</text>
    <text y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#868A94" text-transform="uppercase">Sanitaire de Luxe</text>
    <text y="174" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#A5865E" letter-spacing="1">VISUEL CONSULTABLE AU SHOWROOM</text>
  </g>
</svg>
