<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Wall / Room Ambient Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B1F" />
      <stop offset="50%" stop-color="#24262C" />
      <stop offset="100%" stop-color="#16171A" />
    </linearGradient>

    <!-- Floor Marble Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E313A" />
      <stop offset="30%" stop-color="#22242A" />
      <stop offset="100%" stop-color="#131417" />
    </linearGradient>

    <!-- Warm Backlight Glow -->
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9C2A0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#C5A880" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Brass Accents -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E2C6"/>
      <stop offset="45%" stop-color="#C5A880"/>
      <stop offset="85%" stop-color="#8C6F47"/>
      <stop offset="100%" stop-color="#5E4528"/>
    </linearGradient>

    <!-- Marble Slab Gradient -->
    <linearGradient id="marbleSlab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E4DD"/>
      <stop offset="30%" stop-color="#F5F3EE"/>
      <stop offset="70%" stop-color="#E5DFD5"/>
      <stop offset="100%" stop-color="#DBD4C8"/>
    </linearGradient>

    <!-- Fluted wood / dark vanity front -->
    <linearGradient id="flutedWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1C20"/>
      <stop offset="50%" stop-color="#2A2C33"/>
      <stop offset="100%" stop-color="#1A1B1F"/>
    </linearGradient>

    <pattern id="marbleVeins" width="400" height="400" patternUnits="userSpaceOnUse">
      <path d="M0 80 Q 120 110, 230 70 T 400 130" fill="none" stroke="#D1C7BA" stroke-width="1.2" opacity="0.4"/>
      <path d="M30 0 Q 150 160, 280 220 T 390 380" fill="none" stroke="#C5B9AA" stroke-width="0.8" opacity="0.3"/>
      <path d="M100 400 Q 220 280, 310 320" fill="none" stroke="#B8AB9A" stroke-width="1" opacity="0.35"/>
    </pattern>

    <pattern id="flutes" width="16" height="100" patternUnits="userSpaceOnUse">
      <rect width="12" height="100" fill="#25272F"/>
      <rect x="12" width="4" height="100" fill="#18191E"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#363A45" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Wall -->
  <rect width="1600" height="720" fill="url(#wallGrad)" />

  <!-- Floor Perspective with Tile/Slab joints -->
  <path d="M 0 720 L 1600 720 L 1600 1000 L 0 1000 Z" fill="url(#floorGrad)" />
  <g stroke="#3D424F" stroke-width="1" opacity="0.4">
    <line x1="0" y1="720" x2="1600" y2="720" stroke-width="2" stroke="#505565"/>
    <line x1="200" y1="720" x2="-200" y2="1000" />
    <line x1="500" y1="720" x2="200" y2="1000" />
    <line x1="800" y1="720" x2="700" y2="1000" />
    <line x1="1100" y1="720" x2="1200" y2="1000" />
    <line x1="1400" y1="720" x2="1700" y2="1000" />
    <line x1="0" y1="830" x2="1600" y2="830" />
    <line x1="0" y1="920" x2="1600" y2="920" />
  </g>

  <!-- Backlit Grand Circular Mirror -->
  <circle cx="800" cy="360" r="280" fill="url(#mirrorGlow)" />
  <circle cx="800" cy="360" r="190" fill="#26282F" stroke="url(#brass)" stroke-width="3" />
  <circle cx="800" cy="360" r="185" fill="#1A1B20" opacity="0.6"/>
  <!-- Mirror Reflection shimmer -->
  <path d="M 680 230 Q 770 200, 920 300 Q 820 380, 680 230 Z" fill="#FFFFFF" opacity="0.04"/>

  <!-- Left: Frameless Glass Shower Enclosure -->
  <rect x="150" y="80" width="380" height="640" fill="#2A303C" opacity="0.18" />
  <line x1="530" y1="80" x2="530" y2="720" stroke="#717A8C" stroke-width="2" opacity="0.6"/>
  <!-- Brushed Brass Shower Column & Rain Shower Head -->
  <line x1="340" y1="120" x2="340" y2="380" stroke="url(#brass)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 340 120 L 400 120 L 400 150" fill="none" stroke="url(#brass)" stroke-width="5" stroke-linecap="round"/>
  <rect x="370" y="150" width="60" height="8" rx="2" fill="url(#brass)"/>
  <!-- Thermostatic Mixer & Hand Shower -->
  <rect x="330" y="380" width="20" height="60" rx="3" fill="url(#brass)"/>
  <line x1="340" y1="440" x2="370" y2="520" stroke="url(#brass)" stroke-width="3"/>
  <rect x="368" y="520" width="6" height="24" rx="2" fill="url(#brass)"/>

  <!-- Center-Right: Luxury Floating Vanity Unit -->
  <!-- Shadow under vanity -->
  <ellipse cx="800" cy="740" rx="340" ry="25" fill="#0A0B0D" opacity="0.6"/>

  <!-- Vanity Main Body (Fluted charcoal wood) -->
  <rect x="490" y="550" width="620" height="150" rx="3" fill="url(#flutes)"/>
  <!-- Vanity Marble Countertop -->
  <rect x="480" y="530" width="640" height="25" rx="3" fill="url(#marbleSlab)"/>
  <rect x="480" y="530" width="640" height="25" fill="url(#marbleVeins)"/>
  <!-- Brass trim dividing drawers -->
  <line x1="490" y1="625" x2="1110" y2="625" stroke="url(#brass)" stroke-width="1.5" opacity="0.8"/>
  <line x1="795" y1="550" x2="795" y2="700" stroke="#121316" stroke-width="2"/>
  <!-- Minimalist Brass Drawer Handles -->
  <line x1="610" y1="585" x2="670" y2="585" stroke="url(#brass)" stroke-width="3" stroke-linecap="round"/>
  <line x1="930" y1="585" x2="990" y2="585" stroke="url(#brass)" stroke-width="3" stroke-linecap="round"/>
  <line x1="610" y1="660" x2="670" y2="660" stroke="url(#brass)" stroke-width="3" stroke-linecap="round"/>
  <line x1="930" y1="660" x2="990" y2="660" stroke="url(#brass)" stroke-width="3" stroke-linecap="round"/>

  <!-- Vessel Basin (White Ceramic Matt Sink) -->
  <ellipse cx="800" cy="528" rx="140" ry="18" fill="#D3D5DA" />
  <path d="M 670 528 C 670 555, 930 555, 930 528 Z" fill="#FBFBFC" stroke="#D1D4DC" stroke-width="1"/>
  <ellipse cx="800" cy="527" rx="130" ry="14" fill="#E6E8ED" />
  <ellipse cx="800" cy="527" rx="14" ry="4" fill="url(#brass)" />

  <!-- Wall-mounted or Tall Brass Faucet -->
  <path d="M 800 440 L 800 480" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 780 435 Q 800 415, 800 440" fill="none" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>
  <!-- Faucet mixer knob -->
  <circle cx="830" cy="455" r="7" fill="url(#brass)"/>

  <!-- Right: Towel Warmer & Atmospheric Lighting -->
  <g transform="translate(1220, 240)">
    <!-- Heated towel rail (Brushed Gold) -->
    <rect x="0" y="0" width="12" height="340" rx="3" fill="url(#brass)"/>
    <rect x="140" y="0" width="12" height="340" rx="3" fill="url(#brass)"/>
    <line x1="12" y1="50" x2="140" y2="50" stroke="url(#brass)" stroke-width="6"/>
    <line x1="12" y1="110" x2="140" y2="110" stroke="url(#brass)" stroke-width="6"/>
    <line x1="12" y1="170" x2="140" y2="170" stroke="url(#brass)" stroke-width="6"/>
    <line x1="12" y1="230" x2="140" y2="230" stroke="url(#brass)" stroke-width="6"/>
    <line x1="12" y1="290" x2="140" y2="290" stroke="url(#brass)" stroke-width="6"/>
    <!-- Folded Towel -->
    <rect x="25" y="100" width="100" height="85" rx="5" fill="#F4EFEA" opacity="0.9"/>
  </g>

  <!-- Ambient light wash overlay -->
  <rect width="1600" height="1000" fill="black" opacity="0.15" />
</svg>
